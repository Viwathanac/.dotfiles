##########################
###  HYPRLOCK MODULES  ###
##########################

$font = JetBrainsMono Nerd Font

# GENERAL
general {
    hide_cursor = true
    no_fade_in = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

# BACKGROUND
background {
    monitor = 
    blur_passes = 0
    color = $base
}

# LAYOUT
label {
    monitor = 
    text = Layout: $LAYOUT
    color = $text
    font_size = 25
    font_family = $font
    position = 30, -30
    halign = left
    valign = top
}

# TIME
label {
    monitor = 
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor = 
    text = cmd[update:43200000] date +"%A, %d-%B-%Y"
    color = $text
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# USER AVATAR
image {
    monitor = 
    path = ~/wallpapers/hyprlock/double_fish_square.jpg
    size = 350
    rounding = -1
    border_size = 0
    border_color = $mauve
    position = 0, 235
    halign = center
    valign = center
    zindex = -1
}

# USERNAME
label {
    monitor = 
    text = <span foreground="##$mauveAlpha">$USER</span>
    color = $text
    font_size = 15
    font_family = $font
    position = 0, 10
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor = 
    size = 200, 50
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $mauve
    inner_color = $surface0
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha"><i>󰌾  Enter Your Password </i></span>
    hide_input = false
    check_color = $mauve
    fail_color = $red
    fail_text = Incorrect Password
    capslock_color = $yellow
    position = 0, -50
    halign = center
    valign = center
}
